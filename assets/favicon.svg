<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Purple rounded square background -->
  <rect width="32" height="32" rx="7" fill="#5b3de8"/>
  
  <!-- Paper/document shape -->
  <rect x="8" y="6" width="13" height="17" rx="1.5" fill="white" opacity="0.15"/>
  <rect x="9" y="7" width="11" height="15" rx="1" fill="white"/>
  
  <!-- X mark on the paper -->
  <line x1="12" y1="11" x2="17" y2="16" stroke="#5b3de8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="17" y1="11" x2="12" y2="16" stroke="#5b3de8" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Print lines -->
  <line x1="11" y1="18" x2="18" y2="18" stroke="#5b3de8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="11" y1="20" x2="16" y2="20" stroke="#5b3de8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Arrow pointing down (download/print) -->
  <path d="M22 17 L22 24 M19.5 21.5 L22 24 L24.5 21.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
